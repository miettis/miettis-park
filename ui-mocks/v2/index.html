<head>

<style>
:root{--bg:#f5f6f2;--ink:#173b30;--muted:#758278;--line:#dde4da;--green:#20724f;--pale:#e8f2e9;--red:#a65249}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 system-ui,sans-serif;color:var(--ink)}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,a:focus-visible{outline:3px solid #e4ae40;outline-offset:3px}a{color:var(--green)}.prototype{background:#173b30;color:#e5eee5;padding:9px 28px;font-size:12px;display:flex;justify-content:space-between}.prototype a{color:white}.shell{max-width:1560px;margin:auto;display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 36px)}aside{padding:32px 22px;border-right:1px solid var(--line);background:#fafbf8;display:flex;flex-direction:column;gap:30px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:750;letter-spacing:-.8px}.logo{background:var(--green);color:white;border-radius:10px;width:34px;height:36px;display:grid;place-items:center;font-size:25px}nav{display:grid;gap:8px}nav a{padding:11px 13px;border-radius:8px;text-decoration:none;color:var(--muted)}nav a.active{background:var(--pale);color:var(--green);font-weight:650}.asidefoot{margin-top:auto;font-size:12px;color:var(--muted)}main{min-width:0;padding:27px 36px}.topbar{display:flex;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;margin-bottom:29px}.header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:750;color:var(--green);text-transform:uppercase;margin-bottom:8px}h1{font-size:31px;letter-spacing:-1.1px;line-height:1.2;margin:0 0 9px}h2{font-size:17px;margin:0 0 14px}h3{font-size:15px;margin:0 0 5px}p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 14px;border-radius:7px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.active{background:var(--pale);border-color:var(--green);color:var(--green)}.btn.danger{color:var(--red)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:22px}.columns{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px}.stats{display:flex;gap:12px;margin-bottom:22px}.stat{background:white;border:1px solid var(--line);border-radius:10px;padding:14px 20px;flex:1}.stat strong{display:block;font-size:25px}.stat small{color:var(--muted)}.badge{display:inline-block;padding:3px 8px;background:var(--pale);border-radius:5px;color:var(--green);font-size:11px;font-weight:650}.badge.gray{background:#edf0eb;color:#68766d}.map{position:relative;min-height:470px;background:#edf0e5;overflow:hidden;border-radius:10px;border:1px solid var(--line)}.map svg{position:absolute;inset:0;width:100%;height:100%}.map.small{min-height:320px}.map-note{position:absolute;bottom:10px;left:12px;color:#627464;font-size:10px;background:#ffffffda;padding:4px 8px;border-radius:4px;pointer-events:none}.pin{position:absolute;transform:translate(-50%,-100%);background:white;border:1px solid #cbd9ca;box-shadow:0 5px 18px #19352822;border-radius:9px;padding:10px 14px;color:var(--ink);text-align:left;min-width:135px}.pin:after{content:'';position:absolute;left:calc(50% - 6px);bottom:-7px;width:12px;height:12px;background:inherit;border-right:1px solid #cbd9ca;border-bottom:1px solid #cbd9ca;transform:rotate(45deg)}.pin strong{display:block;font-size:17px;color:var(--green)}.pin small{display:block;font-size:10px;color:var(--muted)}.pin.full{background:#f9ece8}.pin.full strong{color:var(--red)}.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;margin-bottom:18px}.garage-card{display:block;width:100%;background:white;border:0;border-bottom:1px solid var(--line);padding:17px 0;text-align:left;color:var(--ink);cursor:pointer}.garage-card:last-child{border:0}.garage-card p{font-size:12px;margin-bottom:10px}.garage-card .row{justify-content:space-between}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:18px 0}.dot{width:9px;height:9px;display:inline-block;border-radius:50%;margin-right:5px;background:#dcefe0}.dot.red{background:#e9b3ac}.dot.gray{background:#bdc6c0}.grid-wrap{overflow:auto;border-radius:9px;background:#f1f3ee;padding:22px}.grid{display:grid;gap:5px;min-width:max-content;user-select:none;touch-action:none}.cell{border:1px solid transparent;width:53px;height:60px;border-radius:5px;background:#e7ebe2;padding:3px;color:#718174;font-size:10px}.cell b{display:block;font-size:17px}.cell.road{background:#d0d6d1;border-color:#c3ccc5;color:#7a887e}.cell.road:before{content:'┄';font-size:30px;line-height:1}.cell.Free{background:#dcefe0;border:1px solid #aacfb5;color:#266541}.cell.Occupied{background:#f3dfda;border:1px solid #d9aaa1;color:#8d463b}.cell.Unknown{background:#e1e5e2;border:1px dashed #96a59a;color:#5b6d60}.cell.selected{outline:3px solid #d8a548;outline-offset:0}.editor .cell{width:45px;height:49px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.hint{font-size:12px;line-height:1.7;color:var(--muted)}label{display:block;font-size:12px;font-weight:650;margin:17px 0 5px}input,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.fields label{margin-top:0}.divider{height:1px;background:var(--line);margin:21px 0}.toast{position:fixed;bottom:23px;left:50%;transform:translateX(-50%);background:#173b30;color:white;padding:12px 20px;border-radius:9px;box-shadow:0 8px 35px #0002;z-index:20;max-width:90vw}.error{color:#a03f32;min-height:23px;font-size:12px;margin-top:8px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:17px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:11px;font-weight:600}td:first-child{padding-left:0}tbody tr:last-child td{border-bottom:0}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.map-off{background:#e6eae2;display:grid;place-items:center;text-align:center;padding:35px;min-height:470px}.form-card{max-width:1000px}.point{position:absolute;width:20px;height:20px;background:var(--green);border:4px solid white;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 2px 8px #0004;pointer-events:none}.subtle{font-size:12px;color:var(--muted)}@media(max-width:1050px){.shell{grid-template-columns:170px 1fr}main{padding:25px 22px}.columns{grid-template-columns:1fr}.columns>section:last-child{order:2}.map{min-height:400px}}@media(max-width:650px){.shell{display:block}aside{padding:15px;border-right:0;border-bottom:1px solid var(--line);gap:14px}nav{display:flex;gap:8px}.asidefoot{display:none}main{padding:20px 14px}.header{align-items:flex-start}h1{font-size:26px}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:21px}.fields{grid-template-columns:1fr}.prototype{padding:9px 14px}.pin{min-width:105px;padding:7px;font-size:11px}.pin strong{font-size:14px}.card{padding:16px}.map{min-height:390px}.topbar{margin-bottom:20px}}
.columns>section{min-width:0}@media(max-width:650px){.header{flex-direction:column}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.stat{min-width:0}.stat small{font-size:10px;overflow-wrap:anywhere}.columns{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="prototype"><span>V2 · INTERAKTIIVINEN UI-LUONNOS · esimerkkidata</span><a href="../index.html">MVP-luonnos ↗</a></div>
<div class="shell"><aside><div class="brand"><span class="logo">P</span>Miettis Park</div><nav><a href="#map" data-nav="map">◎ &nbsp; Hallit kartalla</a><a href="#admin" data-nav="admin">▦ &nbsp; Ylläpito</a></nav><div class="asidefoot">Yksi kerros. Selkeä tilanne.<br><br>Ei kirjautumista tai rooleja.<br>Tallennus vain tämän sivun muistissa.</div></aside><main id="app"></main></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let nextLot=100, selectedLot=null, draft=null, dirty=false, brush='lot', mapOff=false, query='', formPoint=null;
function sample(w,h,states){const cells=Array(w*h).fill(null);let number=1;for(let y=1;y<h-1;y++){for(let x=1;x<w-1;x++){if(y===Math.floor(h/2)){cells[y*w+x]={type:'road'};}else if(y===1||y===h-2){cells[y*w+x]={type:'lot',id:nextLot++,number,state:states[(number-1)%states.length]};number++;}}}return cells;}
let garages=[{id:1,name:'Keskustan pysäköinti',address:'Esimerkkikatu 12, Helsinki',point:{x:42,y:43},w:10,h:5,cells:sample(10,5,['Occupied','Free','Free','Occupied','Unknown']),visits:4},{id:2,name:'Sataman parkki',address:'Rantatie 4, Helsinki',point:{x:71,y:68},w:8,h:5,cells:sample(8,5,['Free','Free','Occupied']),visits:2},{id:3,name:'Aseman halli',address:'Asemakuja 2, Helsinki',point:{x:24,y:71},w:7,h:5,cells:sample(7,5,['Occupied']),visits:6},{id:4,name:'Uusi pysäköintialue',address:'Osoite täydentämättä',point:null,w:8,h:5,cells:Array(40).fill(null),visits:0}];
function totals(g){const lots=g.cells.filter(c=>c?.type==='lot');return{total:lots.length,occupied:lots.filter(c=>c.state==='Occupied').length,free:lots.filter(c=>c.state==='Free').length,unknown:lots.filter(c=>c.state==='Unknown').length};}
function summary(g){const t=totals(g);return `${t.occupied}/${t.total} varattu${t.unknown?' · '+t.unknown+' tuntematon':''}`;}
function garage(id){return garages.find(g=>g.id===Number(id));}
function say(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(say.timer);say.timer=setTimeout(()=>$('toast').hidden=true,4200);}
function mapSvg(){return `<svg viewBox="0 0 800 520" preserveAspectRatio="none" aria-hidden="true"><rect width="800" height="520" fill="#edf0e5"/><path d="M680 0L690 110 640 190 710 300 650 420 690 520H800V0Z" fill="#d1e3e4"/><g fill="#d9e3d0"><rect x="40" y="35" width="170" height="110" rx="30"/><rect x="470" y="30" width="110" height="130" rx="18"/><rect x="355" y="370" width="180" height="115" rx="30"/></g><g stroke="#fff" stroke-width="20" fill="none"><path d="M-20 240L190 180 370 230 630 175 820 190"/><path d="M100 -20L190 180 150 350 220 540"/><path d="M360 -20L370 230 330 540"/><path d="M550 -20L510 230 600 540"/><path d="M-20 405L150 350 350 360 590 390 780 350"/></g><g fill="#e0e4d9" stroke="#cbd4c7" stroke-width="1"><rect x="215" y="55" width="100" height="100" rx="7"/><rect x="230" y="250" width="80" height="65" rx="5"/><rect x="390" y="270" width="100" height="65" rx="5"/><rect x="40" y="270" width="80" height="60" rx="5"/><rect x="390" y="60" width="80" height="100" rx="5"/></g><g fill="#84917e" font-size="12" font-family="system-ui"><text x="60" y="100">Puisto</text><text x="225" y="210">Keskusta</text><text x="655" y="450">Satama</text><text x="365" y="430">Kaupunkipuisto</text></g></svg>`;}
function pageHeader(crumb,title,subtitle,actions=''){return `<div class="topbar"><span>Miettis Park / ${crumb}</span><span class="badge">● &nbsp; Simulaatio</span></div><div class="header"><div><div class="eyebrow">PYSÄKÖINTI, YHDELLÄ SILMÄYKSELLÄ</div><h1>${title}</h1><p>${subtitle}</p></div><div class="row">${actions}</div></div>`;}
function legend(){return '<div class="legend"><span><i class="dot"></i>Vapaa</span><span><i class="dot red"></i>Käytössä</span><span><i class="dot gray"></i>Tuntematon</span><span>┄ Ajorata</span></div>';}
function gridHtml(g,edit=false){return `<div class="grid-wrap"><div class="grid ${edit?'editor':''}" style="grid-template-columns:repeat(${g.w},1fr)">${g.cells.map((c,i)=>`<button class="cell ${c?.type==='road'?'road':c?.state||''} ${c?.id===selectedLot?'selected':''}" data-cell="${i}" aria-label="${c?.type==='lot'?'Paikka '+c.number+', '+({Free:'vapaa',Occupied:'käytössä',Unknown:'tuntematon'}[c.state]):c?.type==='road'?'Ajorata':'Tyhjä ruutu'}">${c?.type==='lot'?`<b>${c.number}</b>${c.state==='Free'?'Vapaa':c.state==='Occupied'?'Varattu':'?'} `:''}</button>`).join('')}</div></div>`;}
function renderMap(){const filtered=garages.filter(g=>(g.name+' '+g.address).toLowerCase().includes(query.toLowerCase()));const total=garages.map(totals).reduce((a,b)=>({total:a.total+b.total,free:a.free+b.free,unknown:a.unknown+b.unknown}),{total:0,free:0,unknown:0});return pageHeader('Hallit','Löydä vapaa paikka','Valitse halli kartalta tai listasta. Merkki avaa paikkanäkymän.',`<button class="btn" data-action="refresh">↻ Päivitä</button>`)+`<div class="stats"><div class="stat"><small>Parkkihalleja</small><strong>${garages.length}</strong></div><div class="stat"><small>Vapaita paikkoja</small><strong>${total.free}<span class="subtle"> / ${total.total}</span></strong></div><div class="stat"><small>Tuntemattomia</small><strong>${total.unknown}</strong></div></div><div class="columns"><section><div class="map ${mapOff?'map-off':''}">${mapOff?'<div><h2>Karttaa ei voitu ladata</h2><p>Voit edelleen avata hallit viereisestä listasta.</p></div>':mapSvg()+filtered.filter(g=>g.point).map(g=>`<button class="pin ${totals(g).free===0?'full':''}" style="left:${g.point.x}%;top:${g.point.y}%" data-open="${g.id}">${esc(g.name)}<strong>${summary(g)}</strong><small>${esc(g.address)}</small></button>`).join('')}<span class="map-note">Havainnollistava kartta · ei oikea karttapalvelu</span></div><div class="row" style="justify-content:space-between;margin-top:12px"><p class="hint">Varattu = käytössä. Tuntemattomat näytetään erikseen.</p><button class="btn" data-action="map-error">${mapOff?'Palauta kartta':'Simuloi karttavirhe'}</button></div></section><section class="card"><h2>Hallit lähialueella</h2><label for="search">Hae nimellä tai osoitteella</label><input id="search" class="search" value="${esc(query)}" placeholder="Hae hallia…">${filtered.map(g=>`<button class="garage-card" data-open="${g.id}"><h3>${esc(g.name)}</h3><p>${esc(g.address)}</p><div class="row"><span class="badge ${totals(g).free===0?'gray':''}">${summary(g)}</span><span>↗</span></div>${!g.point?'<span class="hint">Sijainti puuttuu</span>':''}</button>`).join('')||'<p>Ei hakutuloksia.</p>'}</section></div>`;}
function renderGarage(g){if(!g)return pageHeader('Hallit','Hallia ei löytynyt','Palaa kartalle ja valitse halli.','<a class="btn" href="#map">Kartalle</a>');const c=g.cells.find(c=>c?.id===selectedLot);const t=totals(g);return pageHeader(esc(g.name),esc(g.name),esc(g.address),`<a class="btn" href="#map">← Kartalle</a><a class="btn" href="#edit/${g.id}">Muokkaa pohjaa</a>`)+`<div class="stats"><div class="stat"><small>Vapaa</small><strong>${t.free}</strong></div><div class="stat"><small>Varattu / yhteensä</small><strong>${t.occupied} / ${t.total}</strong></div><div class="stat"><small>Hallikäynnit · itsenäinen tieto</small><strong>${g.visits}</strong></div></div><div class="columns"><section class="card"><div class="row" style="justify-content:space-between"><h2>Paikkatilanne</h2><span class="badge gray">1. kerros</span></div>${legend()}${t.total?gridHtml(g):'<div class="empty">Halliin ei ole vielä maalattu paikkoja.</div>'}<p class="hint" style="margin-top:16px">Valitse paikka nähdäksesi sen tiedot ja simulaatiotoiminnot.</p></section><section class="card"><div class="eyebrow">PAIKAN SIMULAATIO</div><h2>${c?'Paikka '+c.number:'Valitse paikka'}</h2><p>${c?({Free:'Paikka on vapaa.',Occupied:'Paikka on käytössä.',Unknown:'Paikan tila on tuntematon.'}[c.state]):'Napsauta numeroitua ruutua pohjakuvasta.'}</p>${c?`<label for="plate">Auton rekisteri (valinnainen lisätieto)</label><input id="plate" placeholder="Ei tiedossa" value="${esc(c.plate||'')}"><div class="row" style="margin-top:16px"><button class="btn primary" data-status="Occupied" ${c.state!=='Free'?'disabled':''}>Simuloi käyttö</button><button class="btn" data-status="Free" ${c.state==='Free'?'disabled':''}>Vapauta</button><button class="btn" data-status="Unknown">Tuntematon</button></div>`:''}<div class="divider"></div><h3>Hallikäynti</h3><p class="hint">Sisään- ja ulosajohavainnot eivät muuta paikkojen tilaa.</p><div class="row" style="margin-top:14px"><button class="btn" data-visit="1">Sisäänajo +1</button><button class="btn" data-visit="-1" ${!g.visits?'disabled':''}>Ulosajo −1</button></div><p class="hint" style="margin-top:15px">V2-mockissa hallikäynnit ovat vain lukumääräsimulaatio. Varsinainen portti- ja kuittiluonnos löytyy <a href="../index.html#gate">MVP-kokoelmasta</a>.</p></section></div>`;}
function renderAdmin(){return pageHeader('Ylläpito','Parkkihallit','Luo halli, määritä sijainti ja maalaa paikat.',`<a class="btn primary" href="#form/new">+ Uusi halli</a>`)+`<section class="card table-wrap"><table><thead><tr><th>Halli ja osoite</th><th>Käyttötilanne</th><th>Sijainti</th><th></th></tr></thead><tbody>${garages.map(g=>`<tr><td><h3>${esc(g.name)}</h3><p class="subtle">${esc(g.address)}</p></td><td>${summary(g)}</td><td><span class="badge ${g.point?'':'gray'}">${g.point?'Määritetty':'Puuttuu'}</span></td><td><div class="row"><a class="btn" href="#form/${g.id}">Perustiedot</a><a class="btn" href="#edit/${g.id}">Maalaa pohja</a><a class="btn" href="#garage/${g.id}">Avaa ↗</a></div></td></tr>`).join('')}</tbody></table></section><p class="hint" style="margin-top:16px">Ylläpito on oma osionsa. Demossa ei tarvita rooleja tai kirjautumista.</p>`;}
function renderForm(g){formPoint=g?.point?{...g.point}:null;return pageHeader('Ylläpito / Perustiedot',g?'Muokkaa hallia':'Uusi parkkihalli','Osoite kirjoitetaan käsin. Valitse sijainti kartalta.',`<a class="btn" href="#admin">← Hallit</a>`)+`<form id="garage-form" class="card form-card"><div class="fields"><section><label for="name">Hallin nimi</label><input id="name" required maxlength="120" value="${esc(g?.name||'')}" placeholder="Esim. Keskustan pysäköinti"><label for="address">Osoite</label><input id="address" required value="${esc(g?.address||'')}" placeholder="Katuosoite, kaupunki"><div class="divider"></div><span class="badge gray">Yksi kerros</span><p class="hint" style="margin-top:12px">Uusi halli aloittaa tyhjällä pohjalla. Seuraavaksi pääset maalaamaan ajoradat ja parkkipaikat.</p><label>Karttasijainti</label><p id="coordinates" class="hint">${formPoint?pointLabel(formPoint):'Valitse piste kartalta →'}</p><div id="form-error" class="error" role="alert"></div></section><section><div id="location-map" class="map small" tabindex="0" role="button" aria-label="Valitse sijainti kartalta klikkaamalla; näppäimistöllä Enter valitsee keskikohdan">${mapSvg()}<span id="location-point" class="point" style="${formPoint?`left:${formPoint.x}%;top:${formPoint.y}%`:'display:none'}"></span><span class="map-note">Esimerkkikoordinaatit · ei geokoodausta</span></div><p class="hint">Klikkaa karttaa. Enter valitsee kartan keskikohdan.</p></section></div><div class="divider"></div><div class="row"><button class="btn primary" type="submit">${g?'Tallenna muutokset':'Luo halli ja maalaa pohja'}</button><a class="btn" href="#admin">Peruuta</a></div></form>`;}
function pointLabel(p){return `Valittu: ${(60.14+p.y*.0008).toFixed(4)}, ${(24.87+p.x*.0012).toFixed(4)} · havainnepiste`;}
function renderEditor(g){if(!g)return renderGarage(null);if(!draft||draft.id!==g.id){draft=structuredClone(g);dirty=false;}const selected=draft.cells.find(c=>c?.id===selectedLot);return pageHeader('Ylläpito / '+esc(g.name),'Maalaa hallin pohja','Valitse työkalu ja maalaa hiirellä vetämällä.',`<a class="btn" href="#admin">Peruuta</a><button class="btn primary" data-action="save-layout">Tallenna pohja</button>`)+`<div class="columns"><section class="card"><div class="tools">${[['road','┄ Ajorata'],['lot','▦ Parkkipaikka'],['erase','⌫ Pyyhekumi'],['select','↖ Valitse / siirrä']].map(([id,label])=>`<button class="btn ${brush===id?'active':''}" data-brush="${id}">${label}</button>`).join('')}</div>${gridHtml(draft,true)}<div class="row" style="justify-content:space-between;margin-top:14px"><span class="hint">${draft.w} × ${draft.h} ruutua · ${totals(draft).total} paikkaa</span><span class="badge ${dirty?'':'gray'}">${dirty?'Tallentamattomia muutoksia':'Tallennettu pohja'}</span></div></section><section class="card"><h2>Pohjan asetukset</h2><div class="fields"><div><label for="width">Leveys</label><input id="width" type="number" min="1" max="50" value="${draft.w}"></div><div><label for="height">Korkeus</label><input id="height" type="number" min="1" max="50" value="${draft.h}"></div></div><button class="btn" data-action="resize" style="margin-top:12px">Muuta kokoa</button><div class="divider"></div><h3>${selected?'Paikka '+selected.number:'Paikan tiedot'}</h3>${selected?`<label for="lot-number">Paikan numero</label><input id="lot-number" type="number" min="1" value="${selected.number}"><button class="btn" data-action="renumber" style="margin-top:12px">Muuta numero</button><p class="hint" style="margin-top:12px">Pysyvä mock-ID: ${selected.id}<br>Siirrä valittu paikka klikkaamalla tyhjää ruutua Valitse / siirrä -työkalulla.</p>`:'<p class="hint">Valitse ruutu Valitse / siirrä -työkalulla nähdäksesi paikan numeron.</p>'}<div class="divider"></div><p class="hint">Käytössä olevaa tai tuntematonta paikkaa ei voi pyyhkiä. Paikan siirtäminen säilyttää sen numeron, tunnisteen ja tilan.</p>${legend()}<div id="editor-error" class="error" role="alert"></div></section></div>`;}
function route(){const [page='map',id]=location.hash.slice(1).split('/');return{page,id};}
function render(){const {page,id}=route();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.nav===(['admin','form','edit'].includes(page)?'admin':'map')));$('app').innerHTML=page==='map'?renderMap():page==='admin'?renderAdmin():page==='garage'?renderGarage(garage(id)):page==='form'?renderForm(garage(id)):page==='edit'?renderEditor(garage(id)):renderGarage(null);}
function nextNumber(cells){let number=1;const numbers=new Set(cells.filter(c=>c?.type==='lot').map(c=>c.number));while(numbers.has(number))number++;return number;}
function paint(index){const c=draft.cells[index];if(brush==='select'){if(c?.type==='lot'){selectedLot=c.id;}else if(!c&&selectedLot){const previous=draft.cells.findIndex(c=>c?.id===selectedLot);if(previous>=0){draft.cells[index]=draft.cells[previous];draft.cells[previous]=null;dirty=true;}}render();return;}if(c?.type==='lot'&&c.state!=='Free'){say('Vapauta paikka simulaatiossa ennen poistamista tai maalaamista.');return;}if(brush==='lot'){if(c?.type==='lot')return;draft.cells[index]={type:'lot',id:nextLot++,number:nextNumber(draft.cells),state:'Free'};}else draft.cells[index]=brush==='road'?{type:'road'}:null;dirty=true;render();}
function resizeDraft(w,h){if(!Number.isInteger(w)||!Number.isInteger(h)||w<1||h<1||w>50||h>50)return 'Mitat ovat kokonaislukuja väliltä 1–50.';if(draft.cells.some((c,i)=>c?.type==='lot'&&(i%draft.w>=w||Math.floor(i/draft.w)>=h)))return 'Siirrä tai poista ulkopuolelle jäävät paikat ensin.';if(draft.cells.some((c,i)=>c?.type==='road'&&(i%draft.w>=w||Math.floor(i/draft.w)>=h))&&!confirm('Pienennys poistaa ulkopuolelle jäävää ajorataa. Jatketaanko?'))return '';const cells=Array(w*h).fill(null);draft.cells.forEach((c,i)=>{const x=i%draft.w,y=Math.floor(i/draft.w);if(x<w&&y<h)cells[y*w+x]=c;});draft.w=w;draft.h=h;draft.cells=cells;dirty=true;return '';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const {page,id}=route(),g=garage(id);if(b.dataset.open){location.hash='garage/'+b.dataset.open;selectedLot=null;}else if(b.dataset.brush){brush=b.dataset.brush;render();}else if(b.dataset.cell!==undefined&&page==='garage'){selectedLot=g.cells[Number(b.dataset.cell)]?.id??null;render();}else if(b.dataset.status){const c=g.cells.find(c=>c?.id===selectedLot);if(!c)return;if(b.dataset.status==='Occupied'&&c.state!=='Free')return;c.state=b.dataset.status;c.plate=c.state==='Free'?'':$('plate')?.value.trim().toUpperCase();say('Paikan tila päivitetty. Hallikäyntien määrä ei muuttunut.');render();}else if(b.dataset.visit){g.visits=Math.max(0,g.visits+Number(b.dataset.visit));render();say('Hallikäynti kirjattu. Paikkojen tilat säilyivät.');}else if(b.dataset.action==='map-error'){mapOff=!mapOff;render();}else if(b.dataset.action==='refresh'){render();say('Esimerkkitilanne päivitetty.');}else if(b.dataset.action==='save-layout'){Object.assign(g,structuredClone(draft));dirty=false;draft=null;location.hash='garage/'+g.id;say('Pohja tallennettu tämän mockin muistiin.');}else if(b.dataset.action==='resize'){const error=resizeDraft(Number($('width').value),Number($('height').value));if(error)$('editor-error').textContent=error;else render();}else if(b.dataset.action==='renumber'){const number=Number($('lot-number').value),c=draft.cells.find(c=>c?.id===selectedLot);if(!Number.isInteger(number)||number<1||draft.cells.some(x=>x?.type==='lot'&&x.id!==c.id&&x.number===number)){$('editor-error').textContent='Anna positiivinen, hallissa vapaa numero.';return;}c.number=number;dirty=true;render();}});
let painting=false,visited=new Set();document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-cell]');if(route().page!=='edit'||!b)return;e.preventDefault();painting=true;visited=new Set([b.dataset.cell]);paint(Number(b.dataset.cell));});document.addEventListener('pointermove',e=>{if(!painting||route().page!=='edit')return;const b=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-cell]');if(b&&!visited.has(b.dataset.cell)){visited.add(b.dataset.cell);paint(Number(b.dataset.cell));}});document.addEventListener('pointerup',()=>painting=false);document.addEventListener('pointercancel',()=>painting=false);
document.addEventListener('keydown',e=>{const b=e.target.closest('[data-cell]');if(route().page==='edit'&&b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();paint(Number(b.dataset.cell));}if(e.target.id==='location-map'&&e.key==='Enter'){formPoint={x:50,y:50};updatePoint();}});
function updatePoint(){const p=$('location-point');p.style.display='block';p.style.left=formPoint.x+'%';p.style.top=formPoint.y+'%';$('coordinates').textContent=pointLabel(formPoint);}
document.addEventListener('click',e=>{const m=e.target.closest('#location-map');if(!m)return;const r=m.getBoundingClientRect();formPoint={x:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y:Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))};updatePoint();});
document.addEventListener('input',e=>{if(e.target.id==='search'){const start=e.target.selectionStart;query=e.target.value;render();$('search').focus();$('search').setSelectionRange(start,start);}});
document.addEventListener('submit',e=>{if(e.target.id!=='garage-form')return;e.preventDefault();const name=$('name').value.trim(),address=$('address').value.trim();if(!name||!address||!formPoint){$('form-error').textContent='Täytä nimi ja osoite sekä valitse sijainti kartalta.';return;}const g=garage(route().id);if(g){Object.assign(g,{name,address,point:formPoint});location.hash='admin';}else{const id=Math.max(...garages.map(g=>g.id))+1;garages.push({id,name,address,point:formPoint,w:10,h:6,cells:Array(60).fill(null),visits:0});draft=null;location.hash='edit/'+id;}say('Hallin perustiedot tallennettu mockin muistiin.');});
let previousHash=location.hash;window.addEventListener('hashchange',()=>{if(dirty&&previousHash.startsWith('#edit/')&&!confirm('Pohjassa on tallentamattomia muutoksia. Poistutaanko tallentamatta?')){history.replaceState(null,'',previousHash);return;}if(!location.hash.startsWith('#edit/')){draft=null;dirty=false;}previousHash=location.hash;render();});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});render();
</script>
</body></html>
