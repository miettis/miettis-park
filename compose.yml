services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miettis_park}
      POSTGRES_USER: ${POSTGRES_USER:-miettis_park}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      ConnectionStrings__Parking: Host=database;Database=${POSTGRES_DB:-miettis_park};Username=${POSTGRES_USER:-miettis_park};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Database__InitializeOnStartup: "true"
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres-data:
